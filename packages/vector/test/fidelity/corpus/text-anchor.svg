<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120">
  <!-- Tracked text that is right- or centre-aligned is measured differently
       by resvg and by browsers; fidelity.test.ts holds that case against
       Chrome. Here, tracking is on start-aligned text, where they agree. -->
  <text x="150" y="40" text-anchor="middle" font-family="Inter" font-size="28" fill="#1d3f2b">Centred</text>
  <text x="290" y="80" text-anchor="end" font-family="Inter" font-weight="700" font-size="28" fill="#c8102e">END</text>
  <text x="10" y="80" font-family="Inter" font-weight="700" font-size="16" fill="#c8102e" letter-spacing="2">TRACKED</text>
  <text x="10" y="110" font-family="Inter, sans-serif" font-size="20" fill="#29231f">Café<tspan dx="10" dy="-5" font-size="12">small</tspan></text>
</svg>
